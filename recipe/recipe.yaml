schema_version: 1

context:
  version: 1.2.2

package:
  name: odc-algo
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/odc-algo/odc_algo-${{ version }}.tar.gz
  sha256: dbd2130290c558c37eda567aac870b2861c586102a0189ba122192cbf540e56f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=69
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - affine
    - dask-core >=2025.10.0
    - distributed >=2025.10.0
    - geomad
    - numexpr
    - numpy
    - rasterio >=1.3.2
    - odc-geo
    - scipy
    - toolz
    - xarray
tests:
  - python:
      imports:
        - odc
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Miscellaneous Algorithmic helper methods
  license: Apache-2.0
  license_file:
    - license-template.txt
    - LICENSE
  homepage: https://opendatacube.org/
  repository: https://github.com/opendatacube/odc-algo/

extra:
  recipe-maintainers:
    - Ariana-B
    - Kirill888
    - ocefpaf
    - SpacemanPaul
